name: Build and deploy .NET Core application to Web App HotelListingApi

on:
  push:
    branches:
      - main  # Corrigé : aligné avec votre branche principale

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: HotelListingApi
  AZURE_WEBAPP_PACKAGE_PATH: '${{ github.workspace }}/publish'
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: '8.0.x'  # Adaptez la version (.NET 8/9/10) selon votre projet
  WORKING_DIRECTORY: HotelListingAPI

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.WORKING_DIRECTORY }}

      - name: Build
        run: dotnet build ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Publish API
        run: dotnet publish ${{ env.WORKING_DIRECTORY }} --configuration ${{ env.CONFIGURATION }} --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.HotelListingApi_CLIENT_ID_4E44 }}
          tenant-id: ${{ secrets.HotelListingApi_TENANT_ID_4E44 }}
          subscription-id: ${{ secrets.HotelListingApi_SUBSCRIPTION_ID_4E44 }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}